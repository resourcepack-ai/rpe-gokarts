# Go Karts. /kart reload re-reads this file. Options a newer version adds are
# written into it on start, with their defaults; nothing you set is touched.

race:
  # Laps a race is, unless the track sets its own (/kart track laps).
  laps: 3
  # Off, every race is started by staff with /kart start. On, a lobby with
  # min-players waiting counts down lobby-countdown seconds and starts on its
  # own; staff can still /kart start sooner, alone included.
  auto-start: false
  min-players: 2
  lobby-countdown: 20
  # Once the winner is home, how long everybody else has to finish, in seconds.
  finish-timeout: 30
  # The longest a race may run before it is called, in seconds.
  max-seconds: 600
  # How long the results stay up before everybody is back in the lobby, in seconds.
  results-seconds: 12
  # A racer who has not passed a gate for this long is put back on the track
  # at the last one they passed, in seconds. Q does it at once.
  stuck-seconds: 12
  # Until the grid, everybody waits in the lobby: step or fall further than this
  # from it (in blocks) and you are put back. The prefab tracks' viewing deck is
  # nine blocks across; widen it for a lobby of your own that is bigger.
  lobby-radius: 4.8

# Computer drivers, for /kart start --withBots (fill the grid) or --withBots=N.
# They drive the same karts as everybody, with the same keys, and are never in
# the track's records. One of these names each, none twice; past the end of the
# list they are Bot 1, Bot 2...
bots:
  names: [Blaze, Nova, Turbo, Pixel, Comet, Dash, Viper, Echo, Bolt, Ziggy, Sprocket, Pepper]

karts:
  # How fast a kart goes flat out, in blocks a second. The vehicle's own
  # `speed:` (vehicles/karts.yml) is the ceiling a boost may reach; this is
  # the limit it is held to the rest of the time.
  cruise-speed: 13
  # On grass, sand, dirt and the like: what cutting a corner costs.
  offroad-speed: 6
  # What counts as off the road. Any block not in this list is road.
  offroad-blocks: [GRASS_BLOCK, DIRT, COARSE_DIRT, PODZOL, MYCELIUM, SAND, RED_SAND, GRAVEL, SNOW_BLOCK, MUD, MOSS_BLOCK, ROOTED_DIRT, FARMLAND, DIRT_PATH]
  # Driving over this is a boost.
  boost-pad-block: MAGENTA_GLAZED_TERRACOTTA
  # Driving over this throws the kart into the air (the prefab tracks put one
  # at the lip of every ramp). Space in the air is a trick, and landing one is
  # a boost. Put them anywhere on a track of your own.
  jump-pad-block: LIME_GLAZED_TERRACOTTA
  # A jump pad throws the kart up at `lift` blocks a second. In front of a gap
  # it looks for the far side and throws the kart just fast enough to land
  # `margin` blocks past it, at `max-speed` at most; on flat ground it is a hop
  # with `forward` added.
  jump: {lift: 12, forward: 3, max-speed: 22, margin: 3}
  # A kart turns less on these: it slides wide of where it is pointed.
  ice-blocks: [ICE, PACKED_ICE, BLUE_ICE]
  # The driving tricks (drift boosts, boost pads) on karts parked and driven
  # outside a race too, not only in one.
  tricks-outside-races: true

# Every boost: how hard it kicks (blocks a second added at once) and how long
# the speed limit is lifted for (seconds).
boost:
  pad: {kick: 5, seconds: 1.0}
  nitro: {kick: 7, seconds: 1.6}
  # Holding W as the last light comes on (and not before the second).
  rocket-start: {kick: 6, seconds: 1.2}
  # Landing a trick off a jump pad.
  trick: {kick: 4, seconds: 0.8}

# Hold space (the handbrake) while steering, at speed: the kart slides, and the
# longer you hold the slide the bigger the boost when you let go. Sparks show
# the level: blue, then orange, then purple.
drift:
  min-speed: 6
  levels:
    - {after: 0.8, kick: 3, seconds: 0.5}
    - {after: 1.8, kick: 5, seconds: 0.9}
    - {after: 3.0, kick: 7, seconds: 1.3}

items:
  enabled: true
  # How long a smashed item box takes to come back, in seconds.
  box-respawn: 3
  # How long the roulette spins before you get your item, in seconds.
  roulette: 1.5
  # A banana's spin-out, and a rocket's hit, in seconds.
  banana-stun: 1.2
  rocket-stun: 1.8
  # How fast a rocket flies, in blocks a second, and the longest it looks for its target.
  rocket-speed: 34
  rocket-seconds: 10
  # A bumper orb rolls along the road at this speed (blocks a second) and
  # ricochets off walls, for this long or this many walls; whoever it hits,
  # you too once it is away, spins out for `stun` seconds.
  orb: {speed: 24, seconds: 8, bounces: 5, stun: 1.2}
  # A storm drone climbs over everything, flies at the leader (never at whoever
  # fired it) at this speed, hovers over them for a second and strikes:
  # everybody within `radius` blocks of them is thrown for `stun` seconds.
  drone: {speed: 40, radius: 4, stun: 2.0}
  # Overdrive: for this long, every press is a nitro.
  overdrive-seconds: 6
  # A hyper shield: this long immune to every hit, up to `speed` blocks a
  # second over cruising, and any kart it touches spins out.
  shield: {seconds: 6, speed: 3}
  # A smoke bomb blinds everybody ahead of you for this long.
  smoke-seconds: 3
  # A shockwave horn throws back every kart within `radius` blocks (stunned for
  # `stun` seconds), and clears bananas, orbs, decoys and rockets near you, and
  # a storm drone coming for you.
  horn: {radius: 7, stun: 0.8}
  # A static surge: everybody else loses their item and drives at `slow` of
  # their speed for this long.
  surge: {seconds: 3, slow: 0.65}
  # How likely each item is, by place: the first list is for the leader, the
  # last for whoever is last, and everybody between gets the list nearest
  # their share of the field. Weights, not percentages.
  # An item missing from every row joins at the weights below, so a newer
  # version's items drop on a server with odds of its own; give it 0 to leave
  # it out. banana-bunch is three bananas, decoy a box that is not one, orb
  # a ricocheting ball, drone the leader's problem, overdrive a boost every
  # press, shield a few seconds untouchable, smoke blinds whoever is ahead,
  # horn clears the air round you, surge slows everybody else.
  odds:
    - {banana: 5, banana-bunch: 2, decoy: 3, orb: 3, horn: 2, nitro: 2, triple-nitro: 0, rocket: 1, smoke: 0, overdrive: 0, shield: 0, drone: 0, surge: 0}
    - {banana: 2, banana-bunch: 1, decoy: 1, orb: 3, horn: 1, nitro: 3, triple-nitro: 1, rocket: 2, smoke: 1, overdrive: 0, shield: 0, drone: 0, surge: 0}
    - {banana: 1, banana-bunch: 0, decoy: 0, orb: 1, horn: 1, nitro: 3, triple-nitro: 2, rocket: 3, smoke: 2, overdrive: 1, shield: 1, drone: 1, surge: 0}
    - {banana: 0, banana-bunch: 0, decoy: 0, orb: 0, horn: 0, nitro: 1, triple-nitro: 3, rocket: 3, smoke: 1, overdrive: 3, shield: 2, drone: 1, surge: 1}

# Commands a racer may run during a race (staff with gokarts.bypass.commands
# may run any). /kart is always allowed.
allowed-commands: [msg, tell, w, r, reply, me, list]

ui:
  # The HUD and the results screen: RP Engine content ids. Point either at
  # your own; a replacement has to print the same values (see the README).
  hud: gokarts:hud
  results: gokarts:results

# Every word a player reads. MiniMessage. {prefix} is the prefix below.
messages:
  prefix: "<bold><gradient:#FF4655:#FFD23F:#5BE37D>GO KARTS</gradient></bold> <#5F6368>▏</#5F6368>"
  joined: "{prefix} <#E8EAED>You're in the lobby for <#FFD23F>{track}</#FFD23F>. {hint}"
  hint-start: "<#9AA0A6>Run <#FFD23F>/kart start</#FFD23F> whenever you like.</#9AA0A6>"
  hint-wait: "<#9AA0A6>The race starts once {min} are waiting.</#9AA0A6>"
  # With race.auto-start off: staff start every race.
  hint-staff: "<#9AA0A6>The race starts when staff start it.</#9AA0A6>"
  left: "{prefix} <#E8EAED>You left the race."
  not-in: "{prefix} <#FF5C5C>You're not in a race."
  already-in: "{prefix} <#FF5C5C>You're already in a race. <#9AA0A6>/kart leave</#9AA0A6> first."
  no-track: "{prefix} <#FF5C5C>There's no track ready to race on. An op can build one with <#FFD23F>/kart track generate</#FFD23F>."
  track-closed: "{prefix} <#FF5C5C>{track} is closed."
  track-not-ready: "{prefix} <#FF5C5C>{track} isn't ready: it still needs {missing}."
  race-running: "{prefix} <#FF5C5C>A race is already on at {track}. You'll be in the next one."
  grid-full: "{prefix} <#9AA0A6>The grid is full this time. You're first in line for the next race."
  race-closed: "{prefix} <#9AA0A6>{track} was closed, so you're back where you were."
  full: "{prefix} <#FF5C5C>{track} is full."
  colour-set: "{prefix} <#E8EAED>You'll drive the <{hex}>{colour}</{hex}> kart if it's free."
  colour-unknown: "{prefix} <#FF5C5C>No kart is {colour}. Try {list}."
  lobby-count: "<#E8EAED>{track} <#5F6368>·</#5F6368> <#FFD23F>{n}</#FFD23F> waiting <#5F6368>·</#5F6368> starting in <#FFD23F>{seconds}</#FFD23F>"
  lobby-wait: "<#E8EAED>{track} <#5F6368>·</#5F6368> <#FFD23F>{n}</#FFD23F> waiting <#5F6368>·</#5F6368> <#9AA0A6>{need}</#9AA0A6>"
  lobby-need: "waiting for {more} more"
  lobby-staff: "waiting for staff to start it"
  lobby-op: "/kart start when you're ready"
  how-to: "{prefix} <#E8EAED><#FFD23F>W</#FFD23F>/<#FFD23F>S</#FFD23F> to drive, <#FFD23F>A</#FFD23F>/<#FFD23F>D</#FFD23F> to steer, hold <#FFD23F>Space</#FFD23F> in a corner to drift (let go for a boost), <#FFD23F>F</#FFD23F> or a click to use an item, <#FFD23F>Q</#FFD23F> to scrap one you don't want. Off the road or stuck? <#FFD23F>Q</#FFD23F> with empty hands puts you back."
  rocket-start: "{prefix} <#5BE37D>Rocket start!</#5BE37D>"
  stalled: "{prefix} <#FF5C5C>Too early - you stalled it.</#FF5C5C>"
  respawned: "{prefix} <#9AA0A6>Back on the track.</#9AA0A6>"
  finished: "{prefix} <#E8EAED><#FFD23F>{name}</#FFD23F> finished <#FFD23F>{place}</#FFD23F> in <#FFD23F>{time}</#FFD23F>."
  winner: "{prefix} <#FFD23F>{name}</#FFD23F> <#E8EAED>wins at <#FFD23F>{track}</#FFD23F> in <#FFD23F>{time}</#FFD23F>!"
  fastest-lap: "{prefix} <#E8EAED>Fastest lap: <#FFD23F>{name}</#FFD23F>, <#FFD23F>{time}</#FFD23F>."
  record: "{prefix} <#FFD23F><bold>LAP RECORD!</bold></#FFD23F> <#E8EAED>{name} - <#FFD23F>{time}</#FFD23F>"
  timeout: "{prefix} <#9AA0A6>Time's up for everybody still out there.</#9AA0A6>"
  stopped: "{prefix} <#FF5C5C>The race was stopped.</#FF5C5C>"
  race-abandoned: "{prefix} <#9AA0A6>Everybody racing left, so that race is over. Back to the lobby."
  hit-banana: "{prefix} <#FFD23F>Banana!</#FFD23F>"
  hit-decoy: "{prefix} <#FF5C5C>That box was {owner}'s decoy.</#FF5C5C>"
  hit-orb: "{prefix} <#FF5C5C>{owner}'s bumper orb got you.</#FF5C5C>"
  hit-drone: "{prefix} <#FF5C5C>{owner}'s storm drone struck.</#FF5C5C>"
  drone-coming: "{prefix} <#FF5C5C>A storm drone is coming for you!</#FF5C5C> <#9AA0A6>A shockwave horn stops it.</#9AA0A6>"
  hit-smoke: "{prefix} <#9AA0A6>{owner} threw a smoke bomb.</#9AA0A6>"
  hit-horn: "{prefix} <#FF5C5C>{owner}'s horn blew you back.</#FF5C5C>"
  hit-surge: "{prefix} <#FF5C5C>{owner}'s static surge. Your item is gone.</#FF5C5C>"
  hit-shield: "{prefix} <#FF5C5C>You touched {owner}'s hyper shield.</#FF5C5C>"
  blocked: "{prefix} <#5BE37D>Your shield took it.</#5BE37D>"
  no-target: "{prefix} <#9AA0A6>There is nobody ahead of you to send it at. Keep it for later.</#9AA0A6>"
  hit-rocket: "{prefix} <#FF5C5C>{name} got you with a rocket.</#FF5C5C>"
  got-rocket: "{prefix} <#5BE37D>Your rocket got {name}.</#5BE37D>"
  command-blocked: "{prefix} <#FF5C5C>You can't use that during a race. <#9AA0A6>/kart leave</#9AA0A6> to leave."
  given: "{prefix} <#E8EAED>A <{hex}>{colour}</{hex}> kart. Right-click the ground to park it, then right-click it to get in."
  given-other: "{prefix} <#E8EAED>Gave {player} a <{hex}>{colour}</{hex}> kart."
  no-permission: "{prefix} <#FF5C5C>You can't do that."
  player-only: "{prefix} <#FF5C5C>That's for players."
  unknown-player: "{prefix} <#FF5C5C>Nobody called {player} is online."
  reloaded: "{prefix} <#E8EAED>Reloaded config.yml{tracks}."
  reloaded-tracks: " and tracks.yml"
  reloaded-not-tracks: " (tracks.yml is in use by a race, and will be read after it)"

  # A kart driven outside a race: the line above the hotbar.
  free-speed: "<#E8EAED>{speed}</#E8EAED> <#9AA0A6>km/h</#9AA0A6>"
  free-drift-1: "  <#4FC3FF>▮</#4FC3FF><#3A3F47>▮▮</#3A3F47>"
  free-drift-2: "  <#FF9D2E>▮▮</#FF9D2E><#3A3F47>▮</#3A3F47>"
  free-drift-3: "  <#C86BFF>▮▮▮</#C86BFF>"
  free-boost: "  <#FFD23F><bold>BOOST</bold></#FFD23F>"

  # The HUD's words. hud-lap is drawn big, so it may use only A-Z, 0-9, ! - ' / : .
  # and spaces. The banners (GO!, FINAL LAP, FINISH!, WRONG WAY...) are pictures,
  # drawn by tools/hud_art.py, and are not set here.
  hud-lap: "LAP"
  hud-waiting: "Wait for the lights"
  hud-respawning: "Hold on..."
  hud-scrapped: "Item scrapped"
  hud-on-track: "On the road - Q puts you back only off it"
  hud-best: "Best {time}"
  # Before a lap is done.
  hud-best-none: "Best -:--.--"
  hud-finished-place: "You finished {place}"
  # The line across the top of the screen when something happens to somebody.
  feed-rocket: "{shooter} ▸ rocket ▸ {victim}"
  feed-banana: "{victim} slipped on {owner}'s banana"
  feed-decoy: "{victim} hit {owner}'s decoy box"
  feed-orb: "{owner} ▸ bumper orb ▸ {victim}"
  feed-drone: "{owner} ▸ storm drone ▸ {victim}"
  feed-smoke: "{owner} smoked out the leaders"
  feed-horn: "{owner} ▸ horn ▸ {victim}"
  feed-surge: "{owner} surged the whole field"
  feed-shield: "{owner}'s shield ▸ {victim}"
  feed-finish: "{name} finished {place}"

  # Item names, under the item card.
  item-none: ""
  item-roulette: "..."
  item-banana: "Banana - F to drop, Q to scrap"
  item-nitro: "Nitro - F to boost, Q to scrap"
  item-triple-nitro: "Triple Nitro - {left} left - F to boost, Q to scrap"
  item-rocket: "Rocket - F to fire, Q to scrap"
  item-banana-bunch: "Banana Bunch - {left} left - F to drop, Q to scrap"
  item-decoy: "Decoy Box - F to drop, Q to scrap"
  item-orb: "Bumper Orb - F to roll, Q to scrap"
  item-drone: "Storm Drone - F to send it at the leader, Q to scrap"
  item-overdrive: "Overdrive - F as often as you like, Q to scrap"
  item-shield: "Hyper Shield - F to switch it on, Q to scrap"
  item-smoke: "Smoke Bomb - F to blind the leaders, Q to scrap"
  item-horn: "Shockwave Horn - F to blow, Q to scrap"
  item-surge: "Static Surge - F to zap everybody, Q to scrap"

  # The results screen (dialogs/results.json).
  results-title: "RACE RESULTS"
  results-place: "#"
  results-driver: "Driver"
  results-time: "Time"
  results-best: "Best lap"
  results-dnf: "DNF"
  results-laps: "{laps} laps"
  results-record: "Lap record {time} - {name}"
