# What the plugin draws in the world and puts in a racer's hand: item boxes,
# bananas, nitro and rockets, and the racing helmets the driver emotes wear.
# Studio models. Generated by tools/make_assets.py.

item_box:
  material: PAPER
  model: item_box
  gui: {texture: icon_box}
  name: "&d&lItem Box"
  lore:
    - "&7Drive through it for an item."

banana:
  material: PAPER
  model: banana
  gui: {texture: icon_banana}
  name: "&e&lBanana"
  lore:
    - "&7Drop it behind you. Whoever hits it spins out."

nitro:
  material: PAPER
  model: nitro
  gui: {texture: icon_nitro}
  name: "&9&lNitro"
  lore:
    - "&7A boost, whenever you like."

rocket:
